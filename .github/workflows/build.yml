name: Build RMK firmware
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYBOARD_TOML_PATH: ${{ github.workspace }}/keyboard.toml
      VIAL_JSON_PATH: ${{ github.workspace }}/vial.json
      # 让 Bindgen 使用 Cortex-M 的标准整数定义，避免转发到宿主头文件。
      BINDGEN_EXTRA_CLANG_ARGS_thumbv7em_none_eabihf: -ffreestanding
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 \
            --profile minimal \
            --target thumbv7em-none-eabihf \
            --component rust-src \
            --component rustfmt \
            --component clippy \
            --component llvm-tools
          rustup default 1.96.0

      - name: Install ARM C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --release --locked --bins -- -D warnings

      - name: Test status LED state
        run: |
          rustfmt --edition 2021 --check tests/ws2812.rs
          rustc --edition 2021 --test tests/ws2812.rs -o target/ws2812-tests
          ./target/ws2812-tests

      - name: Check flash layout
        run: python3 tests/test_memory_layout.py

      - name: Install nextest
        run: |
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-unknown-linux-musl.tar.gz
          printf '521c5f790ed07ee69d0a88403d9d86a8c8ab27977f12fc73f22aa4e7e14a0f71  %s\n' "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-nextest
          cargo nextest --version

      - name: Run RMK library tests
        env:
          KEYBOARD_TOML_PATH: ${{ github.workspace }}/tests/rmk.toml
        run: >-
          cargo nextest run --manifest-path vendor/rmk/Cargo.toml
          --target x86_64-unknown-linux-gnu
          --no-default-features
          --features std,log,split,_ble,vial,storage
          --lib

      - name: Install cargo-make
        run: |
          archive="$RUNNER_TEMP/cargo-make.zip"
          asset=cargo-make-v0.37.24-x86_64-unknown-linux-gnu
          curl -fsSL --retry 3 -o "$archive" "https://github.com/sagiegurari/cargo-make/releases/download/0.37.24/$asset.zip"
          printf '92a663fe3eeae741c17788202937f2e2f3f7effa2669f733f4d6a1659954288b  %s\n' "$archive" | sha256sum -c -
          unzip -jo "$archive" "$asset/cargo-make" -d "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo make --version

      - name: Build UF2 artifacts
        run: cargo make uf2

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rmk-cornix-firmware
          if-no-files-found: error
          path: |
            rmk-cornix-central.hex
            rmk-cornix-central.uf2
            rmk-cornix-peripheral.hex
            rmk-cornix-peripheral.uf2

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: rmk-cornix-firmware
          path: firmware

      - name: Package and publish firmware
        working-directory: firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=rmk-cornix-central.uf2
          right=rmk-cornix-peripheral.uf2
          archive="rmk-cornix-${GITHUB_REF_NAME}.zip"
          test -s "$left"
          test -s "$right"
          zip -q "$archive" "$left" "$right"
          sha256sum "$archive" > SHA256SUMS

          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes "$archive" SHA256SUMS
